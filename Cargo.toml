[package]
name = "firp"
version = "0.1.0"
edition = "2021"
authors = ["FortranGoingOnForty"]
description = "A Modern Fortran Interpreter"
license = "MIT"
repository = "https://github.com/FortranGoingOnForty/firp"

[[bin]]
name = "firp"
path = "src/main.rs"

[dependencies]
rustyline = "14.0"
rayon = "1.10"
termcolor = "1.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# JIT compilation (Sprint 22)
cranelift = "0.111"
cranelift-module = "0.111"
cranelift-jit = "0.111"
cranelift-codegen = "0.111"
cranelift-frontend = "0.111"
cranelift-native = "0.111"
target-lexicon = "0.12"

[dev-dependencies]
